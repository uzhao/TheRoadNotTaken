<!-- PROTOTYPE（工单 010）：三种结构不同的主界面方案，底部悬浮条或 #a / #b / #c 切换；假数据，无持久化，用完即弃。 -->
<title>TheRoadNotTaken 主界面原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 布局概念：三套壳 —— A 领域看板（侧栏 + 网格）、B 地图（全幅分层图 + 抽屉）、C 前沿清单（单列 feed + 矩阵） */
:root{
  --bg:#f5f6f2; --panel:#ffffff; --fg:#1b221e; --muted:#5f6b64; --line:#d9ded8;
  --accent:#0d6b63; --accent-ink:#ffffff;
  --mastered:#2f7d4f; --mastered-bg:#dcefe2;
  --learning:#b4730b; --learning-bg:#fbeccd;
  --claimed:#6b4fc1; --claimed-bg:#e8e1fa;
  --deferred:#7b847e; --deferred-bg:#e9ebe8;
  --unlearned:#c7cdc8; --unlearned-bg:#ffffff;
  --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141916; --panel:#1d2420; --fg:#e6ebe7; --muted:#9aa69f; --line:#2f3934;
  --accent:#4fb3a8; --accent-ink:#0d1512;
  --mastered:#6fcf97; --mastered-bg:#1f3a2b; --learning:#f0b35a; --learning-bg:#3d2e14;
  --claimed:#b9a4f5; --claimed-bg:#2e2650; --deferred:#9aa69f; --deferred-bg:#2a302c;
  --unlearned:#3b453f; --unlearned-bg:#1d2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --panel:#1d2420; --fg:#e6ebe7; --muted:#9aa69f; --line:#2f3934;
  --accent:#4fb3a8; --accent-ink:#0d1512;
  --mastered:#6fcf97; --mastered-bg:#1f3a2b; --learning:#f0b35a; --learning-bg:#3d2e14;
  --claimed:#b9a4f5; --claimed-bg:#2e2650; --deferred:#9aa69f; --deferred-bg:#2a302c;
  --unlearned:#3b453f; --unlearned-bg:#1d2420; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{font:inherit;width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel);color:var(--fg)}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.tag{display:inline-block;white-space:nowrap;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid transparent;letter-spacing:.02em}
.tag.mastered{background:var(--mastered-bg);color:var(--mastered)}
.tag.learning{background:var(--learning-bg);color:var(--learning)}
.tag.claimed{background:var(--claimed-bg);color:var(--claimed)}
.tag.deferred{background:var(--deferred-bg);color:var(--deferred)}
.tag.unlearned{background:var(--unlearned-bg);color:var(--muted);border-color:var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.dot.mastered{background:var(--mastered)} .dot.learning{background:var(--learning)} .dot.claimed{background:var(--claimed)} .dot.deferred{background:var(--deferred)} .dot.unlearned{background:transparent;border:1.5px solid var(--unlearned)}
#app{min-height:100%}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 切换条 */
#switcher{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:#111;color:#fff;border-radius:999px;padding:6px 10px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:50;font-size:13px}
#switcher button{background:#333;color:#fff;border:none;border-radius:999px;padding:3px 10px}
#switcher b{font-weight:500}
/* 顶栏 */
.topbar{display:flex;align-items:center;gap:14px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .brand{font-weight:700;letter-spacing:.04em}
.topbar nav{display:flex;gap:4px}
.topbar nav button{border:none;background:transparent;padding:4px 10px;border-radius:999px}
.topbar nav button.on{background:var(--accent);color:var(--accent-ink)}
/* 推荐卡 */
.rec{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rec .kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rec .title{font-weight:600;font-size:15px}
.rec .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.rec.hero{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
/* ===== A ===== */
.A .shell{display:grid;grid-template-columns:260px 1fr;min-height:calc(100% - 50px)}
.A .side{border-right:1px solid var(--line);background:var(--panel);padding:12px 10px;overflow:auto}
.A .side h3{font-size:11px;letter-spacing:.1em;color:var(--muted);margin:10px 8px 6px}
.A .frow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.A .frow:hover,.A .frow.on{background:var(--bg)}
.A .frow .name{font-size:13px;line-height:1.3}
.A .frow .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.A .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:flex}
.A .bar i{display:block;height:100%}
.A .main{padding:16px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.A .recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.A .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.A .tcard{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border-left-width:4px}
.A .tcard.mastered{border-left-color:var(--mastered)} .A .tcard.learning{border-left-color:var(--learning)} .A .tcard.claimed{border-left-color:var(--claimed)} .A .tcard.deferred{border-left-color:var(--deferred)} .A .tcard.unlearned{border-left-color:var(--line)}
.A .tcard .nm{font-weight:500;line-height:1.35}
.A .tcard .cc{font-size:12px;color:var(--muted);line-height:1.4}
.A .tcard.locked{opacity:.55}
@media (max-width:800px){.A .shell{grid-template-columns:1fr}.A .side{border-right:none;border-bottom:1px solid var(--line);max-height:200px}}
/* 学习页 A：讲义 + 右侧追问 */
.A .learn{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:16px 20px;align-items:start}
.A .chat{position:sticky;top:60px;border:1px solid var(--line);background:var(--panel);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 90px)}
@media (max-width:900px){.A .learn{grid-template-columns:1fr}.A .chat{position:static;max-height:none}}
/* 讲义正文通用 */
.lecture{font-family:var(--serif);font-size:16px;line-height:1.85;max-width:68ch;min-width:0}
.lecture h1{font-size:26px;line-height:1.3;margin-bottom:6px;font-weight:600}
.lecture h2{font-size:19px;margin:22px 0 6px;font-weight:600}
.lecture p{margin:8px 0}
.lecture .fig{border:1px dashed var(--line);border-radius:8px;padding:12px;margin:12px 0;background:var(--panel);text-align:center;color:var(--muted);font-family:var(--sans);font-size:13px}
.lecture .fig .box{height:180px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--bg) 0 8px,var(--panel) 8px 16px);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.lecture .fig.pending .box{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.lecture .fig.pending .box{animation:none}}
.lecture .example{border-left:3px solid var(--accent);padding:4px 12px;margin:10px 0;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.lecture .cursor::after{content:"▍";color:var(--accent);animation:pulse .8s infinite}
.lhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--sans);font-size:13px;color:var(--muted);margin-bottom:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--sans);font-size:12px}
.steps span{padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.steps span.on{border-color:var(--learning);color:var(--learning)}
.steps span.done{color:var(--mastered)}
/* 追问 */
.chat .log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.chat .msg{padding:8px 10px;border-radius:8px;max-width:95%;font-size:13px;line-height:1.5}
.chat .msg.q{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.chat .msg.a{align-self:flex-start;background:var(--bg)}
.chat .in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat .in textarea{min-height:40px;flex:1}
.chat .hd{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:500;display:flex;justify-content:space-between;align-items:center}
/* 验证通用 */
.q{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.q .qt{font-weight:500}
.q .ref{font-size:13px;background:var(--bg);border-radius:6px;padding:8px 10px;color:var(--muted)}
.score{font-variant-numeric:tabular-nums;font-weight:600}
.verdict{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.verdict.pass{background:var(--mastered-bg);color:var(--mastered)}
.verdict.fail{background:var(--learning-bg);color:var(--learning)}
.verdict .acts{display:flex;gap:8px;flex-wrap:wrap}
.verdict .acts button{color:var(--fg)}
/* ===== B ===== */
.B .map{position:relative;height:calc(100vh - 50px);overflow:hidden;background:var(--bg)}
.B svg{width:100%;height:100%;cursor:grab;touch-action:none}
.B svg:active{cursor:grabbing}
.B .node{cursor:pointer}
.B .node rect{stroke-width:1.2}
.B .node text{font-size:10px;font-family:var(--sans);fill:var(--fg);pointer-events:none}
.B .node.mastered rect{fill:var(--mastered-bg);stroke:var(--mastered)} .B .node.learning rect{fill:var(--learning-bg);stroke:var(--learning)} .B .node.claimed rect{fill:var(--claimed-bg);stroke:var(--claimed)} .B .node.deferred rect{fill:var(--deferred-bg);stroke:var(--deferred)} .B .node.unlearned rect{fill:var(--panel);stroke:var(--unlearned)}
.B .node.frontier rect{stroke-width:2.5;stroke:var(--accent)}
.B .edge{stroke:var(--line);fill:none;stroke-width:1}
.B .edge.hl{stroke:var(--accent);stroke-width:2}
.B .band{fill:var(--muted);font-size:11px;font-family:var(--sans);letter-spacing:.06em}
.B .float{position:absolute;top:12px;left:12px;width:280px;display:flex;flex-direction:column;gap:8px;z-index:3}
.B .legend{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px;z-index:3}
.B .zoom{position:absolute;right:12px;top:12px;background:var(--panel);padding:4px;border-radius:8px;display:flex;gap:4px;z-index:3}
.B .drawer{position:absolute;top:0;right:0;bottom:0;width:360px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px;z-index:4;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
@media (max-width:700px){.B .float{width:calc(100% - 24px)}}
.B .learnwrap{padding:16px 20px;padding-bottom:140px;display:flex;justify-content:center}
.B .bottom{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:6;transition:height .2s;height:52px;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.B .bottom.open{height:min(60vh,480px)}
.B .bottom .hd{padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;flex:none}
.B .bottom .chat{flex:1;min-height:0;display:flex;flex-direction:column}
.B .wiz{max-width:720px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.B .dots{display:flex;gap:6px;align-items:center}
.B .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.B .dots i.on{background:var(--accent)} .B .dots i.done{background:var(--mastered)}
/* ===== C ===== */
.C .col{max-width:860px;margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:18px}
.C .frontier{display:flex;flex-direction:column;gap:8px}
.C .frow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.C .frow .acts{display:flex;gap:6px}
.C .frow .nm{font-weight:500}
.C .frow .fd{font-size:12px;color:var(--muted)}
.C .matrix{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;align-items:center;font-size:12px}
.C .matrix .cells{display:flex;gap:3px;flex-wrap:wrap}
.C .cell{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);cursor:pointer}
.C .cell.mastered{background:var(--mastered);border-color:var(--mastered)} .C .cell.learning{background:var(--learning);border-color:var(--learning)} .C .cell.claimed{background:var(--claimed);border-color:var(--claimed)} .C .cell.deferred{background:var(--deferred-bg)} .C .cell.unlearned{background:var(--panel)}
.C .cell.frontier{box-shadow:0 0 0 2px var(--accent)}
.C .matrix .fl{cursor:pointer;color:var(--muted)}
.C .matrix .fl.on{color:var(--fg);font-weight:500}
.C .outline{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 12px}
.C .outline li{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.C .outline ol{margin:0;padding-left:22px}
.C .learn{max-width:760px;margin:0 auto;padding-block:16px}
.C .thread{margin-top:24px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.C .ask{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.C .ask textarea{min-height:40px;flex:1}
.C .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1100px;margin:0 auto;padding-block:16px}
@media (max-width:800px){.C .split{grid-template-columns:1fr}}
/* ===== D 合并方案 ===== */
.D .vtoggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.D .vtoggle button{border:none;border-radius:0;padding:4px 12px;background:transparent}
.D .vtoggle button.on{background:var(--fg);color:var(--bg)}
.D .vmap{position:relative;height:calc(100vh - 230px);min-height:420px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.D .vmap svg{width:100%;height:100%;cursor:grab;touch-action:none}
.D .vmap .node{cursor:pointer}
.D .vmap .node rect{stroke-width:1.2}
.D .vmap .node text{font-size:10px;font-family:var(--sans);fill:var(--fg);pointer-events:none}
.D .vmap .node.mastered rect{fill:var(--mastered-bg);stroke:var(--mastered)} .D .vmap .node.learning rect{fill:var(--learning-bg);stroke:var(--learning)} .D .vmap .node.claimed rect{fill:var(--claimed-bg);stroke:var(--claimed)} .D .vmap .node.deferred rect{fill:var(--deferred-bg);stroke:var(--deferred)} .D .vmap .node.unlearned rect{fill:var(--bg);stroke:var(--unlearned)}
.D .vmap .node.frontier rect{stroke-width:2.5;stroke:var(--accent)}
.D .vmap .edge{stroke:var(--line);fill:none;stroke-width:1}
.D .vmap .edge.cross{stroke:color-mix(in srgb,var(--accent) 45%,var(--line));stroke-dasharray:3 3}
.D .vmap .fhead{font-size:11px;font-family:var(--sans);fill:var(--muted)}
.D .vmap .fhead.branch{fill:var(--claimed)}
.D .vmap .ctl{position:absolute;right:10px;top:10px;display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:8px;z-index:2}
.D .vmap .lg{position:absolute;left:10px;bottom:10px;font-size:12px;display:flex;gap:10px;background:var(--panel);padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.D .mcq{display:flex;flex-direction:column;gap:6px}
.D .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.D .opt:hover{background:var(--bg)}
.D .opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.D .opt.right{border-color:var(--mastered);background:var(--mastered-bg)}
.D .opt.wrong{border-color:var(--learning);background:var(--learning-bg)}
.D .opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:16px}
.D .opt .ex{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.D .vlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:16px 20px;align-items:start}
@media (max-width:900px){.D .vlayout{grid-template-columns:1fr}}
.D .appeal{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;font-size:13px}
</style>

<div id="app"></div>
<div id="switcher" aria-label="原型方案切换">
  <button id="prev" aria-label="上一个方案">←</button>
  <b id="vlabel"></b>
  <button id="next" aria-label="下一个方案">→</button>

function recommendations(n=3){
  const out=[];
  DATA.topics.filter(t=>S[t.id]==='claimed').forEach(t=>out.push({kind:'verify',t}));
  const fr = frontier().sort((a,b)=>{
    const ka=(F[a.field].kind==='core'?0:1), kb=(F[b.field].kind==='core'?0:1);
    if(ka!==kb) return ka-kb;
    if((S[a.id]==='learning')!==(S[b.id]==='learning')) return S[a.id]==='learning'?-1:1;
    return a.id<b.id?-1:1;
  });
  fr.forEach(t=>out.push({kind:'learn',t}));
  return out.slice(0,n);
}

function lectureSegments(t){
  const f=F[t.field];
  return [
    {tag:'h1',text:t.name},
    {tag:'meta'},
    {tag:'h2',text:'一、历史动机'},
    {tag:'p',text:`十七世纪中叶，${f.name.slice(0,4)}领域的核心难题之一正是「${t.concepts[0]}」。在牛顿与莱布尼茨之前，人们只能逐个问题地构造特殊方法；而一旦把「${t.concepts[1]||t.concepts[0]}」看作一个统一的运算，原本彼此无关的几何、运动与求和问题便被同一条线索串起。这个主题要讲的，就是这条线索如何被发现、又为何需要「${t.concepts[2]||t.concepts[0]}」来把它说严格。`},
    {tag:'h2',text:'二、核心概念'},
    {tag:'p',text:`设 f 在区间 [a, b] 上连续，定义 F(x) = ∫ₐˣ f(t) dt。那么 F 在 [a, b] 上可导，并且 F′(x) = f(x)。这就是说：「变上限积分」对上限求导，得到的正是被积函数本身。它把两个看上去方向相反的运算——求面积与求切线——接在了一起。`},
    {tag:'fig',name:'ftc-area-under-curve.svg',caption:'曲线 y = f(t) 下从 a 到 x 的面积随 x 变化；阴影增量 ΔF 近似为 f(x)·Δx。',attempts:1},
    {tag:'p',text:`由此立刻得到计算定积分的办法：只要找到 f 的任意一个原函数 G，就有 ∫ₐᵇ f(x) dx = G(b) − G(a)。这条公式把「无穷多个小矩形求和」化为「两次代入相减」，是整个微积分最重要的计算工具。`},
    {tag:'h2',text:'三、例题'},
    {tag:'ex',text:`例 1　计算 ∫₀¹ x² dx。\n解　取 G(x) = x³/3，则 G′(x) = x²。于是 ∫₀¹ x² dx = G(1) − G(0) = 1/3。\n注意不必回到 Riemann 和的定义：原函数一旦找到，计算就结束了。`},
    {tag:'fig',name:'substitution-limits.svg',caption:'换元 u = 2x 时积分上下限随之变为 0 与 2，图中两条数轴标出了对应关系。',attempts:2},
    {tag:'ex',text:`例 2　计算 ∫₀¹ 2x·cos(x²) dx。\n解　令 u = x²，du = 2x dx，当 x 从 0 到 1 时 u 从 0 到 1。原式 = ∫₀¹ cos u du = sin 1 − sin 0 = sin 1。\n这里最容易出错的是忘记同步改写上下限——这正是你上次验证时暴露的薄弱点之一。`},
    {tag:'h2',text:'四、常见误区'},
    {tag:'p',text:`「可积」与「有原函数」是两回事：有的函数 Riemann 可积却没有初等原函数（如 e^(−x²)），有的函数有原函数却不可积。基本定理的两个方向各有前提，务必分清。`},
  ];
}

function bindCommon(root){
  root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render();});

/* ---------- 流式模拟 ---------- */
let streamTimer=null, skipStream=false;
function startStream(){
  clearTimeout(streamTimer); skipStream=false;
  const host=document.getElementById('lecture'); if(!host) return;
  const t=T[topicId]; const segs=lectureSegments(t);
  const stepsEl=document.getElementById('steps');
  const skipBtn=document.getElementById('skip'); if(skipBtn) skipBtn.onclick=()=>{skipStream=true;};
  let i=0;
  const metaHtml=`<div class="lhead"><span class="tag ${S[t.id]}">${STATE_NAME[S[t.id]]}</span><span>${F[t.field].name}</span><span class="mono">${t.id}</span>${weak[t.id]?`<span style="color:var(--learning)">薄弱点：${weak[t.id].join('；')}</span>`:''}</div>`;
  function stepTag(s,cls){ if(!stepsEl) return; stepsEl.innerHTML += `<span class="${cls}">${s}</span>`; }
  function next(){
    if(i>=segs.length){ host.querySelectorAll('.cursor').forEach(e=>e.classList.remove('cursor')); stepTag('讲义已缓存','done'); return; }
    const sg=segs[i++];
    if(sg.tag==='meta'){ host.insertAdjacentHTML('beforeend',metaHtml); return next(); }
    if(sg.tag==='fig'){
      const fig=document.createElement('div'); fig.className='fig pending';
      fig.innerHTML=`<div class="box">正在画图…（尝试 1/${sg.attempts}）</div><div>${sg.caption}</div><div class="mono">figures/${sg.name}</div>`;
      host.appendChild(fig); stepTag(`画图 ${sg.name}`,'on');
      let a=1; const tick=()=>{ if(skipStream||a>=sg.attempts){ fig.classList.remove('pending'); fig.querySelector('.box').textContent='[ 插图占位：'+sg.name+' ]'; stepsEl && (stepsEl.lastElementChild.className='done'); return next(); } a++; fig.querySelector('.box').textContent=`脚本报错，正在重试…（尝试 ${a}/${sg.attempts}）`; streamTimer=setTimeout(tick,1400); };
      streamTimer=setTimeout(tick,skipStream?0:1400); return;
    }
    const el=document.createElement(sg.tag==='ex'?'div':sg.tag); if(sg.tag==='ex') el.className='example';
    el.classList.add('cursor'); host.appendChild(el);
    if(i===3) stepTag('生成正文','on');
    const text=sg.text; let k=0;
    const type=()=>{ if(skipStream){k=text.length;} k=Math.min(text.length,k+6); el.innerHTML=text.slice(0,k).replace(/\n/g,'<br>'); if(k<text.length){streamTimer=setTimeout(type,40);} else {el.classList.remove('cursor'); next();} };
    type();
  }
  next();
}

function doGrade(){
  const sc=vz.answers.map(gradeAnswer); const avg=sc.reduce((a,b)=>a+b,0)/3;
  vz.graded={scores:sc,pass:avg>=0.6,comments:sc.map(s=>s===1?'要点完整。':s===0.5?'说到了核心，但缺少条件或例子。':'没有作答或过于简略。')};
  if(vz.graded.pass){ S[topicId]='mastered'; delete weak[topicId]; }
  else { S[topicId]='learning'; weak[topicId]=sc.map((s,i)=>s<1?`第 ${i+1} 题涉及的「${T[topicId].concepts[i]||T[topicId].concepts[0]}」`:null).filter(Boolean); }
}
function doAppeal(){ vz.appealed=true; const i=vz.graded.scores.findIndex((s,k)=>s<1&&vz.answers[k].trim()); if(i>=0){vz.graded.scores[i]=Math.min(1,vz.graded.scores[i]+0.5); vz.graded.comments[i]+='（申诉后复核：采纳你的解释，上调评分）'; const avg=vz.graded.scores.reduce((a,b)=>a+b,0)/3; if(avg>=0.6){vz.graded.pass=true;S[topicId]='mastered';delete weak[topicId];}} }
function verdictHtml(){
  const g=vz.graded; const t=T[topicId];
  return `<div class="verdict ${g.pass?'pass':'fail'}"><b>${g.pass?'通过 · 该主题标记为已掌握':'未通过 · 回到学习中'}</b>

}
function bindVerify(root){
  root.querySelectorAll('textarea[data-ans]').forEach(ta=>ta.oninput=()=>{vz.answers[+ta.dataset.ans]=ta.value;});
  const g=root.querySelector('[data-grade]'); if(g) g.onclick=()=>{ g.disabled=true; g.textContent='agent 评分中…'; setTimeout(()=>{doGrade();render();},1200); };
  const ap=root.querySelector('[data-appeal]'); if(ap) ap.onclick=()=>{ap.disabled=true;ap.textContent='复核中…';setTimeout(()=>{doAppeal();render();},1200);};

let drawerOpen=null, view={x:320,y:70,k:1}, layout=null;
function computeLayout(){
  const depth={}; const d=t=>{ if(depth[t.id]!=null) return depth[t.id]; depth[t.id]= t.prerequisites.length? 1+Math.max(...t.prerequisites.map(p=>d(T[p]))) : 0; return depth[t.id]; };
  DATA.topics.forEach(d);
  const cols={}; DATA.topics.forEach(t=>(cols[depth[t.id]] ??= []).push(t));
  const pos={}; const W=150,H=34,GX=60,GY=10;
  Object.keys(cols).sort((a,b)=>a-b).forEach(c=>{ cols[c].sort((a,b)=>a.field<b.field?-1:1); cols[c].forEach((t,r)=>{pos[t.id]={x:c*(W+GX),y:r*(H+GY)};}); });
  layout={pos,W,H,maxCol:Math.max(...Object.keys(cols).map(Number)),maxRow:Math.max(...Object.values(cols).map(c=>c.length))};
}
function mapSvg(){
  if(!layout) computeLayout(); const {pos,W,H}=layout;
  const fr=new Set(frontier().map(t=>t.id));
  const edges=DATA.topics.flatMap(t=>t.prerequisites.map(p=>{const a=pos[p],b=pos[t.id];const hl=drawerOpen&&(drawerOpen===t.id||drawerOpen===p);return `<path class="edge ${hl?'hl':''}" d="M${a.x+W},${a.y+H/2} C${a.x+W+30},${a.y+H/2} ${b.x-30},${b.y+H/2} ${b.x},${b.y+H/2}"/>`;}));
  const nodes=DATA.topics.map(t=>{const p=pos[t.id];const nm=t.name.length>11?t.name.slice(0,11)+'…':t.name;return `<g class="node ${S[t.id]} ${fr.has(t.id)?'frontier':''}" transform="translate(${p.x},${p.y})" data-node="${t.id}"><title>${t.name}（${F[t.field].name}）· ${STATE_NAME[S[t.id]]}</title><rect width="${W}" height="${H}" rx="6"/><text x="8" y="14">${nm}</text><text x="8" y="27" class="band">${F[t.field].name.slice(0,8)}</text></g>`;});
  const bands=Array.from({length:layout.maxCol+1},(_,c)=>`<text class="band" x="${c*(W+60)}" y="-14">第 ${c} 层</text>`);
  return `<svg id="map" viewBox="0 0 1200 700"><g id="vp" transform="translate(${view.x},${view.y}) scale(${view.k})">${bands.join('')}${edges.join('')}${nodes.join('')}</g></svg>`;
}
function initMap(){
  const svg=document.getElementById('map'); if(!svg) return; const vp=document.getElementById('vp');
  const apply=()=>vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  let drag=null;
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();const s=1200/r.width;view.x=drag.vx+(e.clientX-drag.x)*s;view.y=drag.vy+(e.clientY-drag.y)*s;apply();});
  svg.addEventListener('pointerup',e=>{if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<4){const g=e.target.closest('[data-node]');if(g){drawerOpen=g.dataset.node;topicId=drawerOpen;render();}}drag=null;});
  svg.addEventListener('wheel',e=>{e.preventDefault();const k=Math.min(3,Math.max(.3,view.k*(e.deltaY<0?1.1:0.9)));view.k=k;apply();},{passive:false});
  document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{view.k=b.dataset.zoom==='+'?Math.min(3,view.k*1.25):b.dataset.zoom==='-'?Math.max(.3,view.k/1.25):1;if(b.dataset.zoom==='0'){view.x=320;view.y=70;}apply();});
  const focus=document.querySelector('[data-focus]'); if(focus) focus.onclick=()=>{const id=focus.dataset.focus;const p=layout.pos[id];view.k=1.2;view.x=600-(p.x+75)*1.2;view.y=350-(p.y+17)*1.2;apply();};
}

  const st=fieldStats(fieldSel);
  const board=`<section><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px"><h2 style="font-size:18px">${F[fieldSel].name}</h2><span class="muted">${F[fieldSel].kind==='core'?'主干':'分支'} · ${st.n} 个主题 · 已掌握 ${st.mastered}</span></div>
    <div class="grid">${byField[fieldSel].map(t=>`<div class="tcard ${S[t.id]} ${unlocked(t)||isM(t.id)?'':'locked'}" id="card-${t.id}"><div style="display:flex;justify-content:space-between;gap:6px"><span class="nm">${t.name}</span><span class="tag ${S[t.id]}">${STATE_NAME[S[t.id]]}</span></div><span class="cc">${t.concepts.join(' · ')}</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:2px">${topicActions(t)}</div></div>`).join('')}</div></section>`;
  const graph=`<section><div class="vmap">${vmapSvg()}<div class="ctl"><button data-vz="+">＋</button><button data-vz="-">－</button><button data-vz="fit">适应宽度</button></div>
    <div class="lg"><span><i class="dot mastered"></i> 已掌握</span><span><i class="dot learning"></i> 学习中</span><span><i class="dot claimed"></i> 声称掌握</span><span><i class="dot unlearned"></i> 未学</span><span style="color:var(--accent)">粗边 = 现在可学</span><span class="muted">虚线 = 跨领域前置</span></div></div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">每一列是一个领域，自上而下按前置深度排列；点节点回到看板。只读。</p></section>`;
  return topbar(`已掌握 ${DATA.topics.filter(t=>isM(t.id)).length} / ${DATA.topics.length} 个主题`)+`<div class="shell">
  <aside class="side"><h3>主干</h3>${fieldRows('core')}<h3>分支</h3>${fieldRows('branch')}</aside>
  <main class="main">
    <section style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start"><div>${rec?recCard(rec,true):'<p class="muted">暂无推荐。</p>'}</div>
      <div class="vtoggle"><button data-dview="board" class="${dView==='board'?'on':''}">看板</button><button data-dview="graph" class="${dView==='graph'?'on':''}">全图</button></div></section>
    ${dView==='board'?board:graph}
  </main></div>`;
}
function computeVLayout(){
  const depth={}; const d=t=>{ if(depth[t.id]!=null) return depth[t.id]; depth[t.id]= t.prerequisites.length? 1+Math.max(...t.prerequisites.map(p=>d(T[p]))) : 0; return depth[t.id]; };
  DATA.topics.forEach(d);
  const W=108,H=30,GX=22,GY=16,TOP=24; const pos={};
  DATA.fields.forEach((f,ci)=>{ byField[f.id].forEach(t=>{ pos[t.id]={x:ci*(W+GX),y:TOP+depth[t.id]*(H+GY)}; }); });
  // 同列同层冲突：顺序下移
  DATA.fields.forEach(f=>{ const used=new Set(); byField[f.id].forEach(t=>{ while(used.has(pos[t.id].y)) pos[t.id].y+=H+GY; used.add(pos[t.id].y); }); });
  vlayout={pos,W,H,width:DATA.fields.length*(W+GX),height:Math.max(...Object.values(pos).map(p=>p.y))+H+20};
}
function vmapSvg(){
  if(!vlayout) computeVLayout(); const {pos,W,H}=vlayout; const fr=new Set(frontier().map(t=>t.id));
  const heads=DATA.fields.map((f,ci)=>`<text class="fhead ${f.kind}" x="${ci*(W+22)}" y="12">${f.id.toUpperCase()} ${f.name.slice(0,6)}</text>`);
  const edges=DATA.topics.flatMap(t=>t.prerequisites.map(p=>{const a=pos[p],b=pos[t.id];const cross=T[p].field!==t.field;return `<path class="edge ${cross?'cross':''}" d="M${a.x+W/2},${a.y+H} C${a.x+W/2},${a.y+H+24} ${b.x+W/2},${b.y-24} ${b.x+W/2},${b.y}"/>`;}));
  const nodes=DATA.topics.map(t=>{const p=pos[t.id];const nm=t.name.length>8?t.name.slice(0,8)+'…':t.name;return `<g class="node ${S[t.id]} ${fr.has(t.id)?'frontier':''}" transform="translate(${p.x},${p.y})" data-vnode="${t.id}"><title>${t.name} · ${STATE_NAME[S[t.id]]}</title><rect width="${W}" height="${H}" rx="5"/><text x="6" y="19">${nm}</text></g>`;});
  return `<svg id="vmap" viewBox="0 0 1200 600"><g id="vvp" transform="translate(${vmapView.x},${vmapView.y}) scale(${vmapView.k})">${heads.join('')}${edges.join('')}${nodes.join('')}</g></svg>`;
}
function initVMap(){
  const svg=document.getElementById('vmap'); if(!svg) return; const vp=document.getElementById('vvp');
  const apply=()=>vp.setAttribute('transform',`translate(${vmapView.x},${vmapView.y}) scale(${vmapView.k})`);
  let drag=null;
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:vmapView.x,vy:vmapView.y};svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();const s=1200/r.width;vmapView.x=drag.vx+(e.clientX-drag.x)*s;vmapView.y=drag.vy+(e.clientY-drag.y)*s;apply();});
  svg.addEventListener('pointerup',e=>{if(drag&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<4){const g=e.target.closest('[data-vnode]');if(g){const id=g.dataset.vnode;fieldSel=T[id].field;dView='board';render();setTimeout(()=>{const c=document.getElementById('card-'+id);if(c){c.scrollIntoView({block:'center'});c.style.outline='2px solid var(--accent)';}},0);}}drag=null;});
  svg.addEventListener('wheel',e=>{e.preventDefault();vmapView.k=Math.min(3,Math.max(.25,vmapView.k*(e.deltaY<0?1.1:0.9)));apply();},{passive:false});
  document.querySelectorAll('[data-vz]').forEach(b=>b.onclick=()=>{const z=b.dataset.vz;if(z==='+')vmapView.k=Math.min(3,vmapView.k*1.25);else if(z==='-')vmapView.k=Math.max(.25,vmapView.k/1.25);else{vmapView.k=1160/vlayout.width;vmapView.x=20;vmapView.y=10;}apply();});
}
/* 选择题 */
function MCQ(t){
  const c=i=>t.concepts[i%t.concepts.length];
  return [0,1,2,3,4].map(i=>({concept:c(i),q:`关于「${c(i)}」，下列哪个说法是正确的？`,
    opts:[`它只在有限情形下成立，一般情形需要额外的紧性假设。`,`它是「${c(i+1)}」的直接推论，无需单独证明。`,`它的结论在去掉连续性（或相应的正则性）条件后仍然成立。`,`它把两个原本独立的对象联系起来，并给出了可计算的判别方法。`],
    ans:3, ex:[`不对：这个说法把结论的适用范围说窄了。`,`不对：两者的逻辑关系反了。`,`不对：这正是最常见的误区，条件不可省略。`,`正确：这是该概念存在的意义。`]}));
}
let mq={picks:[null,null,null,null,null],graded:null,appealed:false,voided:null};
function renderVerifyD(){
  const t=T[topicId]; const qs=MCQ(t); const g=mq.graded;
  const qHtml=qs.map((q,i)=>`<div class="q"><span class="qt">${i+1}. ${q.q} <span class="muted" style="font-weight:400;font-size:12px">· ${q.concept}</span></span>
    <div class="mcq">${q.opts.map((o,k)=>{let cls='opt';if(!g){if(mq.picks[i]===k)cls+=' sel';}else{if(k===q.ans)cls+=' right';else if(mq.picks[i]===k)cls+=' wrong';}
      return `<div class="${cls}" ${g?'':`data-pick="${i}:${k}"`}><span class="k">${'ABCD'[k]}</span><span>${o}${g?`<span class="ex">${q.ex[k]}</span>`:''}</span></div>`;}).join('')}</div>
    ${g&&mq.voided===i?'<span class="muted">已申诉作废，不计入</span>':''}</div>`).join('');
  if(!g) return `<div class="gutter" style="max-width:760px;margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:12px"><h2>${t.name} · 验证</h2><p class="muted">5 道单选题，答对 4 题通过。程序判分，提交后可查看每个选项的解析、申诉一道题，并与 agent 讨论。</p>${qHtml}
    <div><button class="primary" data-mgrade ${mq.picks.includes(null)?'disabled':''}>提交（${mq.picks.filter(p=>p!==null).length}/5 已作答）</button> <button data-go="learn">回去再看看讲义</button></div></div>`;
  const right=g.right, denom=g.denom;
  const verdict=`<div class="verdict ${g.pass?'pass':'fail'}"><b>${g.pass?'通过 · 该主题标记为已掌握':'未通过 · 回到学习中'}</b><span>答对 <span class="score">${right} / ${denom}</span>${g.pass?'':'，薄弱点已记录：'+(weak[t.id]||[]).join('；')}</span>
    <div class="acts">${g.pass?`<button class="primary" data-go="web">回到知识网</button>`:`<button class="primary" data-learn="${t.id}">带着薄弱点重读讲义</button><button data-go="web">回到知识网</button>`}</div></div>`;
  const appeal=mq.appealed?`<div class="appeal"><b>申诉结果</b><span>${mq.appealMsg}</span></div>`:`<div class="appeal"><b>申诉一道题</b><span class="muted" style="font-size:12px">如果你认为某题答案键有误或题目有歧义，选题并写一句理由，agent 会复核；每次验证只能申诉一次。</span>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><select id="apq" style="font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)">${qs.map((_,i)=>`<option value="${i}">第 ${i+1} 题</option>`).join('')}</select><textarea id="apr" style="flex:1;min-height:40px" placeholder="理由…"></textarea><button data-mappeal>提交申诉</button></div></div>`;
  return `<div class="vlayout"><div style="display:flex;flex-direction:column;gap:12px;min-width:0"><h2>${t.name} · 验证结果</h2>${verdict}${appeal}${qHtml}</div>
    <div class="chat" style="position:sticky;top:60px"><div class="hd"><span>和 agent 讨论这次验证</span><span class="muted" style="font-size:12px">验证会话</span></div><div class="log"><div class="msg a">评分已出。想讨论哪道题？我可以解释为什么某个选项不对，或者给你一道同概念的变式题。</div>${right<denom?`<div class="msg q">第 ${g.wrongIdx[0]+1} 题我选 ${'ABCD'[mq.picks[g.wrongIdx[0]]]} 是怎么想的……</div><div class="msg a">这个选项常见的误解是把条件当成了可省略的。回到「${qs[g.wrongIdx[0]].concept}」的定义看一下条件出现的位置。</div>`:''}</div><div class="in"><textarea placeholder="就某道题继续问…"></textarea><button class="primary">发送</button></div></div></div>`;
}
function mGrade(){ const qs=MCQ(T[topicId]); const wrong=[]; qs.forEach((q,i)=>{ if(mq.picks[i]!==q.ans) wrong.push(i); }); const right=5-wrong.length; mq.graded={right,denom:5,pass:right>=4,wrongIdx:wrong};
  if(mq.graded.pass){S[topicId]='mastered';delete weak[topicId];} else {S[topicId]='learning';weak[topicId]=wrong.map(i=>`${qs[i].concept}（误选 ${'ABCD'[mq.picks[i]]}：${qs[i].ex[mq.picks[i]].replace('不对：','')}）`);} }
function mAppeal(i,reason){ mq.appealed=true; if(reason.trim().length>=10 && mq.graded.wrongIdx.includes(i)){ mq.voided=i; const denom=4, right=mq.graded.right; mq.graded={right,denom,pass:right>=Math.ceil(denom*0.8),wrongIdx:mq.graded.wrongIdx.filter(k=>k!==i)}; mq.appealMsg=`agent 复核：第 ${i+1} 题题意确有歧义，已作废，不计入分母（${right}/${denom}）。`; if(mq.graded.pass){S[topicId]='mastered';delete weak[topicId];} } else mq.appealMsg=`agent 复核：第 ${i+1} 题答案键无误，维持原判。`; }
document.getElementById('app').addEventListener('click',e=>{
  const dv=e.target.closest('[data-dview]'); if(dv){dView=dv.dataset.dview;render();}
  const pk=e.target.closest('[data-pick]'); if(pk){const [i,k]=pk.dataset.pick.split(':').map(Number);mq.picks[i]=k;render();}
  const mg=e.target.closest('[data-mgrade]'); if(mg){mGrade();render();}
  const ma=e.target.closest('[data-mappeal]'); if(ma){mAppeal(+document.getElementById('apq').value,document.getElementById('apr').value);render();}
  if(e.target.closest('[data-verify]')) mq={picks:[null,null,null,null,null],graded:null,appealed:false,voided:null};
},true);

/* ---------- 全局事件 ---------- */
document.getElementById('app').addEventListener('click',e=>{
  const c=e.target.closest('[data-close]'); if(c){drawerOpen=null;render();}
  const tg=e.target.closest('[data-toggle]'); if(tg){chatOpen=!chatOpen;render();}
  const ol=e.target.closest('[data-outline]'); if(ol){outlineField=outlineField===ol.dataset.outline?null:ol.dataset.outline;render();}
  if(e.target.closest('[data-open]')) e.preventDefault();
});
const origRender=render;
render=function(){ origRender(); bindVerify(document.getElementById('app')); };
function setVariant(v){ variant=v; location.hash=v; page='web'; drawerOpen=null; render(); }
const keys=Object.keys(VARIANTS);
document.getElementById('prev').onclick=()=>setVariant(keys[(keys.indexOf(variant)+keys.length-1)%keys.length]);
document.getElementById('next').onclick=()=>setVariant(keys[(keys.indexOf(variant)+1)%keys.length]);
document.addEventListener('keydown',e=>{ if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable) return; if(e.key==='ArrowLeft') document.getElementById('prev').click(); if(e.key==='ArrowRight') document.getElementById('next').click(); });
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(VARIANTS[v]&&v!==variant)setVariant(v);});
const _go=page; // 进入验证页时重置作答
document.getElementById('app').addEventListener('click',e=>{ if(e.target.closest('[data-verify]')) resetVerify(); },true);
render();
</script>
