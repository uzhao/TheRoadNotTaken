        concept_hints: [Markov 无后效性, $n$ 步转移概率, Chapman–Kolmogorov 方程]
      - name: 状态分类：互通、常返（Recurrence）与暂留（Transience）
        concept_hints: [互通类, 首达时间, '常返判据 $\sum p_{ii}^{(n)}=\infty$', 随机游走 Pólya 常返定理]
      - name: 平稳分布、正常返与遍历定理
        concept_hints: [非周期性, 平稳分布 $\pi=\pi P$ 存在唯一性, 细致平衡与时间可逆性, 遍历大数定律]
      - name: 吸收链、首中时与分支过程（Galton–Watson 过程）
        concept_hints: [吸收概率与平均吸收时间, 赌徒破产问题, 生成函数求灭绝概率]
      - name: Poisson 过程与更新过程初步
        concept_hints: [齐次 Poisson 过程三种等价定义, 到达间隔指数分布, 稀有事件合流与分解]
      - name: 连续时间马尔可夫链（CTMC）与生灭过程
        concept_hints: [指数停留时间, 转移速率矩阵 $Q$, Kolmogorov 向前/向后方程, 排队论 M/M/1 模型]
      - name: 离散时间鞅（Martingales）与停时定理
        concept_hints: ['滤子 $\mathcal{F}_n$', 鞅定义, Doob 可选停时定理及其应用, 鞅收敛定理初步]
      - name: Brown 运动（Wiener 过程）初步
        concept_hints: [独立正态增量, 连续非可微路径, 反射原理与首中时分布, 几何 Brown 运动导引]
  - id: b04
    name: 数值分析（科学计算与微分方程数值解）
    kind: branch
    order: 4
    upstream: [c02, c04, c06]
    upstream_notes: []
    history_sources:
      kline: 【完全未覆盖】
      supplement: "1. 16–19 世纪经典数值方法（牛顿法、插值、高斯求积）：Herman H. Goldstine (1977), *A History of Numerical Analysis from the 16th
        through the 19th Century*, Springer (<https://doi.org/10.1007/978-1-4684-9472-3>)\n2. 20 世纪电子计算机时代（浮点误差、RK 方法、有限差分/有限元）：Stephen
        G. Nash (Ed.) (1990), *A History of Scientific Computing*, ACM Press (<https://dl.acm.org/doi/book/10.1145/87252>)"
    topics:
      - name: 浮点运算、舍入误差、条件数与数值稳定性
        concept_hints: [IEEE 754 浮点数, 机器精度, 相近数相减灾难, 问题条件数 vs 算法向后稳定性]
      - name: 非线性方程（组）求根算法
        concept_hints: [二分法, 不动点迭代与收敛阶, Newton–Raphson 二次收敛, 割线法, 多元 Newton 法]
      - name: 多项式插值与分段样条插值
        concept_hints: [Lagrange 与 Newton 均差插值, 插值余项, Runge 现象与 Chebyshev 节点, 三次样条插值]
      - name: 正交多项式与最佳平方逼近
        concept_hints: [Legendre 与 Chebyshev 正交多项式, 三项递推, 函数空间最小二乘逼近]
      - name: 数值微分与数值积分（Newton–Cotes 与外推）
        concept_hints: [有限差分截断与舍入权衡, 梯形与 Simpson 公式, Richardson 外推与 Romberg 积分]
      - name: Gauss 求积公式
        concept_hints: [节点与权重联合待定, 正交多项式零点构造 $2n-1$ 阶最高代数精度 Gauss 求积]
      - name: 常微分方程数值解：单步法与 Runge–Kutta 法
        concept_hints: [显式/隐式 Euler 法, 局部截断误差与整体收敛阶, 经典四阶 RK4]
      - name: 线性多步法、零稳定性与刚性方程（Stiffness）
        concept_hints: [Adams 多步法, Dahlquist 等价定理, 绝对稳定域与 $A$-稳定性, 刚性系统隐式求解]
      - name: 偏微分方程有限差分法初步
        concept_hints: [Poisson 方程五点差分, 热传导显式与 Crank–Nicolson 格式, CFL 条件与 von Neumann 稳定性分析]
  - id: b05
    name: 数值线性代数与数据矩阵方法（ML 数学）
    kind: branch
    order: 5
    upstream: [c04, c05, c03]
    upstream_notes: []
    history_sources:
      kline: 【完全未覆盖】
      supplement: "1. 矩阵分解、QR 算法与 Krylov/CG：Brezinski, Meurant, & Redivo-Zaglia (2022), *A Journey through the History of
        Numerical Linear Algebra*, SIAM (<https://epubs.siam.org/doi/book/10.1137/1.9781611977233>)\n2. SVD 与低秩逼近：G. W. Stewart
        (1993) (*SIAM Review*, 35(4))\n3. 自动微分与反向传播历史：Andreas Griewank (2012), *\"Who Invented the Reverse Mode of Differentiation?\"\
        *, *Documenta Mathematica*, Extra Vol. ISMP, 389–400 (<https://www.elibm.org/article/10000285>)"
    topics:
      - name: 向量与矩阵范数、条件数与扰动分析
        concept_hints: ['诱导算子范数 $\|A\|_1, \|A\|_2, \|A\|_\infty$ 与 Frobenius 范数', 条件数 $\kappa(A)$ 与解的扰动界]
      - name: 选主元 LU 分解、Cholesky 分解与稀疏直接法
        concept_hints: [列主元消元稳定性, 对称正定矩阵 $A=LL^T$ Cholesky 分解, 三对角追赶法]
      - name: Householder 反射、Givens 旋转与最小二乘 QR 算法
        concept_hints: [正交反射构造 $A=QR$, 避免法方程 $A^TA$ 条件数平方恶化]
      - name: 奇异值分解（SVD）、Eckart–Young 低秩逼近与 PCA
        concept_hints: [矩阵最佳 $k$-秩逼近定理, 样本协方差矩阵与主成分分析 PCA 降维]
      - name: 特征值计算：幂法、反幂法、瑞利商迭代与 QR 算法
        concept_hints: [幂法与反幂法, Rayleigh 商三次收敛, Hessenberg 化约与带位移 QR 迭代]
      - name: 大型稀疏线性系统的定常迭代法
        concept_hints: [Jacobi, Gauss–Seidel 与超松弛 SOR 迭代, 谱半径 $\rho(G)<1$ 收敛充要条件]
      - name: Krylov 子空间方法与共轭梯度法（CG）
        concept_hints: ['Krylov 子空间 $\mathcal{K}_k(A,b)$', '对称正定系统共轭梯度法与 $\frac{\sqrt{\kappa}-1}{\sqrt{\kappa}+1}$ 收敛率', 
              预条件]
      - name: 矩阵微积分与自动微分/反向传播
        concept_hints: [标量对向量与矩阵求导, '迹技巧 $\operatorname{tr}(A^TB)$', 计算图逆向模式自动微分与 Backpropagation]
      - name: 图拉普拉斯矩阵、谱聚类与随机矩阵算法初步
        concept_hints: [图 Laplacian $L=D-W$ 半正定性, Fiedler 向量与谱聚类, PageRank, 随机 SVD]
  - id: b06
    name: 最优化方法与凸优化
    kind: branch
    order: 6
    upstream: [c03, c04, b05]
    upstream_notes:
      - b05：矩阵计算与梯度法（进阶 / 局部主题前置）
    history_sources:
      kline: 仅覆盖古典变分法（Ch. 24, 30），未覆盖现代优化
      supplement: "1. 极值与凸优化通史：V. M. Tikhomirov (1990), *Stories about Maxima and Minima*, AMS\n2. 线性规划、单纯形法与冯·诺伊曼对偶：George
        B. Dantzig (1982), *\"Reminiscences about the Origins of Linear Programming\"*, *Operations Research Letters*, 1(2),
        43–48 (<https://doi.org/10.1016/0167-6377(82)90043-8>)\n3. KKT 条件历史：Tinne Hoff Kjeldsen (2000), *Historia Mathematica*,
        27(4), 331–361 (<https://doi.org/10.1006/hmat.2000.2289>)\n4. 组合与网络流优化：Alexander Schrijver (2005), *\"On the History
        of Combinatorial Optimization (Till 1960)\"* (<https://homepages.cwi.nl/~lex/files/histco.pdf>)"
    topics:
      - name: 凸集与凸函数
        concept_hints: [仿射集与凸集, 超平面分离与支撑定理, 凸函数一阶/二阶判据, 保凸运算与次梯度 $\partial f$]
      - name: 线性规划（LP）标准形、多面体顶点与基本可行解
        concept_hints: [LP 建模, 凸多面体几何, 极点与基本可行解等价性, 线性规划基本定理]
      - name: 单纯形法（Simplex Algorithm）
        concept_hints: [基变换与枢轴旋转, 检验数与最优判据, 退化与 Bland 规则, 两阶段法]
      - name: 线性规划对偶理论、互补松弛与灵敏度分析
        concept_hints: [弱对偶与强对偶定理, Farkas 引理, 互补松弛与影子价格, 零和博弈 Minimax 定理]
      - name: 网络流优化：最短路、最大流最小割与匹配
        concept_hints: [全单模矩阵整性, Ford–Fulkerson 最大流最小割定理, 运输问题]
      - name: 无约束优化算法：梯度下降、线搜索与牛顿/拟牛顿法
        concept_hints: [Armijo 回溯线搜索, 梯度下降收敛率与条件数, Newton 法与 BFGS 拟牛顿法]
      - name: 约束非线性优化、Lagrange 对偶与 KKT 条件
        concept_hints: [Lagrange 对偶函数, Slater 条件与强对偶, Karush–Kuhn–Tucker 最优性条件]
      - name: 机器学习一阶优化：SGD、动量法与近端梯度法
        concept_hints: [经验风险最小化, 随机梯度下降方差与步长, Nesterov 加速梯度, $\ell_1$ 正则近端梯度 ISTA]
      - name: 动态规划（Dynamic Programming）与 Bellman 最优性原理
        concept_hints: [多阶段决策, Bellman 方程, 离散动态规划与马尔可夫决策过程 MDP 导引]
  - id: b07
    name: 统计建模、回归分析与统计学习
    kind: branch
    order: 7
    upstream: [b02, c04]
    upstream_notes: []
    history_sources:
      kline: 【完全未覆盖】
      supplement: "1. 最小二乘、回归与相关系数起源：Stephen M. Stigler (1986), *The History of Statistics*\n2. PCA 历史：Ian T. Jolliffe (2002),
        *Principal Component Analysis* (Ch. 1), Springer\n3. 核方法与 RKHS 历史：Hofmann, Schölkopf, & Smola (2008), *\"Kernel Methods
        in Machine Learning\"*, *Annals of Statistics*, 36(3) (<https://doi.org/10.1214/009053607000000677>)"
    topics:
      - name: 多元线性回归与普通最小二乘（OLS）几何
        concept_hints: [线性模型 $Y=X\beta+\varepsilon$, '列空间投影矩阵 $H=X(X^TX)^{-1}X^T$', 残差正交分解]
      - name: Gauss–Markov 定理与正态线性模型精确推断
        concept_hints: [最佳线性无偏估计 BLUE, 回归系数 $t$ 检验, 整体 $F$ 检验, 预测区间]
      - name: 方差分析（ANOVA）、模型诊断与多重共线性
        concept_hints: [平方和分解, 残差图, 杠杆值与 Cook 距离, 方差膨胀因子 VIF]
      - name: 正则化回归与偏差-方差权衡
        concept_hints: ['均方误差 $\operatorname{Bias}^2 + \operatorname{Var} + \sigma^2$ 分解', Ridge $\ell_2$ 岭回归, Lasso 
              $\ell_1$ 稀疏回归]
      - name: 模型选择与交叉验证（AIC, BIC, CV）
        concept_hints: [训练误差与泛化误差, AIC 与 BIC 信息准则, $K$-折交叉验证]
      - name: 广义线性模型（GLM）与 Logistic 回归
        concept_hints: [指数族分布与连接函数, Logistic 二分类回归, Poisson 回归, 迭代重加权最小二乘 IWLS]
      - name: 非参数统计与核方法初步
        concept_hints: [Bootstrap 自助法, 核密度估计 KDE, 再生核希尔伯特空间直观与核技巧 Kernel Trick]
      - name: 统计学习基础：线性判别（LDA）、SVM 与泛化界直观
        concept_hints: [Bayes 最优分类器, 最大间隔分类器与 SVM 对偶, 经验风险最小化与 VC 维直观]
  - id: b08
    name: 组合数学、图论与计算理论（CS 数学）
    kind: branch
    order: 8
    upstream: [c01, c04, c07]
    upstream_notes:
      - c07：置换群与有限域（进阶 / 局部主题前置）
    history_sources:
      kline: 仅提及欧拉多面体（Ch. 50）与哥德尔（Ch. 51）
      supplement: "1. 图论 200 年原典史：Biggs, Lloyd, & Wilson (1998), *Graph Theory 1736–1936*, Oxford Univ. Press\n2. 香农信息论与编码：Sergio
        Verdú (1998), *\"Fifty Years of Shannon Theory\"*, *IEEE Trans. Info. Theory*, 44(6) (<https://doi.org/10.1109/18.720531>)\n\
        3. 计算理论与复杂性（图灵机、P vs NP）：Avi Wigderson (2019), *Mathematics and Computation*, Princeton Univ. Press（开放获取 PDF：<https://www.math.ias.edu/avi/book>）"
    topics:
      - name: 枚举组合学：双射证明、二项式恒等式与容斥原理
        concept_hints: [组合恒等式, 错排问题与一般容斥公式, 鸽巢原理与 Ramsey 定理初步]
      - name: 生成函数与递推关系
        concept_hints: [普通生成函数 OGF 与指数生成函数 EGF, 常系数递推数列求解, Catalan 数与分拆数]
      - name: 图的基本概念、树、连通性与 Euler/Hamilton 回路
        concept_hints: [握手定理, '生成树 Cayley 公式 $n^{n-2}$', Euler 回路充要条件, Hamilton 圈与连通度]
      - name: 二分图匹配、Hall 婚姻定理与覆盖
        concept_hints: [交错路与增广路, Hall 相异代表系定理, König 匹配-点覆盖定理]
      - name: 平面图、Euler 多面体公式与图着色
        concept_hints: [平面图 $V-E+F=2$, Kuratowski 定理, 点着色色数 $\chi(G)$, 五色定理与色多项式]
      - name: 极值图论与概率方法初步
        concept_hints: [Mantel 与 Turán 定理, Erdős 概率方法：期望线性性与删去法证明存在性]
      - name: 信息论与编码理论初步
        concept_hints: [Shannon 信息熵, 互信息与 KL 散度, 信源编码与信道容量直观, Hamming 纠错码与有限域编码]
      - name: 形式语言、有限自动机与上下文无关文法
        concept_hints: [DFA 与 NFA 等价性, 正则表达式, 泵引理, 上下文无关文法]
      - name: Turing 机、可计算性与停机问题不可判定性
        concept_hints: [Turing 机与 Church–Turing 论题, 通用 Turing 机, 对角化证明停机问题不可判定, 归约法]
      - name: 计算复杂性（P, NP 与 NP-完全性）与 Gödel 不完备性导引
        concept_hints: [时间复杂度类 P 与 NP, 多项式归约与 Cook–Levin 定理, 一阶逻辑完备性与 Gödel 不完备性定理思想]
