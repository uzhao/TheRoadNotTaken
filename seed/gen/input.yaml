    topics:
      - name: 命题逻辑与证明方法
        concept_hints: [蕴含与量词, 逆否命题, 反证法, 数学归纳法与强归纳法]
      - name: 集合、关系与映射
        concept_hints: [集合运算, 单射/满射/双射, 逆映射, 像与原像]
      - name: 等价关系与商集
        concept_hints: [等价类, 集合划分, 商映射, 容斥原理]
      - name: 整除与 Euclid 算法
        concept_hints: [带余除法, 最大公因子, Bézout 等式, 线性丢番图方程]
      - name: 素数与算术基本定理
        concept_hints: [唯一分解定理, Euclid 素数无穷性证明, 素数分布初探]
      - name: 同余与模算术
        concept_hints: ['同余类环 $\mathbb{Z}_n$', 线性同余方程, 中国剩余定理]
      - name: Fermat 小定理、Euler 定理与 Wilson 定理
        concept_hints: [Euler $\varphi$ 函数, 模幂运算, RSA 公钥密码动机]
      - name: 原根与二次剩余
        concept_hints: [模 $p$ 乘法群的循环性, Legendre 符号, 二次互反律]
      - name: 有理数、无理数与上确界公理
        concept_hints: ['$\sqrt{2}$ 与 $e$ 的无理性', 有序域, 上确界公理与 Archimedes 性质]
      - name: 可数集与不可数集
        concept_hints: [基数比较, '$\mathbb{Q}$ 的可数性', 'Cantor 对角线法与 $\mathbb{R}$ 的不可数性', Schröder–Bernstein 定理]
  - id: c02
    name: 单变量微积分与数学分析基础
    kind: core
    order: 2
    upstream: [c01]
    upstream_notes: []
    history_sources:
      kline: 完整覆盖：Ch. 3, 5（穷竭法）、Ch. 16, 17（牛顿与莱布尼茨创立微积分）、Ch. 19, 20（18世纪微积分与无穷级数）、Ch. 40, 41（柯西/魏尔斯特拉斯严密化、一致收敛、实数构造）
      supplement: —
    topics:
      - name: 实数完备性与确界原理
        concept_hints: [Dedekind 分割/Cauchy 基本列直观, 确界存在定理, 区间套定理]
      - name: 数列极限与收敛准则
        concept_hints: ['$\varepsilon\text{-}N$ 定义', 极限四则运算, 夹逼定理, 单调有界定理与数 $e$]
      - name: 子列、Bolzano–Weierstrass 定理与 Cauchy 收敛原理
        concept_hints: [上下极限 $\limsup/\liminf$, 列紧性, 实数完备性等价命题]
      - name: 函数极限与连续函数
        concept_hints: ['$\varepsilon\text{-}\delta$ 定义', 单侧极限, 连续函数局部性质, 间断点分类]
      - name: 闭区间上连续函数的整体性质
        concept_hints: [介值定理, 有界性与最值定理, 一致连续性与 Cantor 定理]
      - name: 导数、微分与求导法则
        concept_hints: [切线与瞬时变化率, 链式法则, 反函数与隐函数求导, 高阶导数与 Leibniz 公式]
      - name: 微分中值定理（Rolle, Lagrange, Cauchy）
        concept_hints: [费马引理, 三大中值定理, Darboux 导数介值定理]
      - name: L'Hôpital 法则、Taylor 公式与凸函数
        concept_hints: [Peano/Lagrange 余项 Taylor 定理, 极值判别, 凸函数与 Jensen 不等式]
      - name: Riemann 积分的定义与可积性判别
        concept_hints: [Darboux 上下和, 振幅与可积充要条件, 连续函数与单调函数的可积性]
      - name: 微积分基本定理与积分计算方法
        concept_hints: [变上限积分, Newton–Leibniz 公式, 换元积分法, 分部积分法, 有理函数积分]
      - name: 反常积分及其收敛性判别
        concept_hints: [无穷区间反常积分, 无界函数瑕积分, 比较判别法, Dirichlet 与 Abel 判别法]
      - name: 数项级数收敛性
        concept_hints: [正项级数比值/根值/积分判别法, 交错级数 Leibniz 判别法, 绝对收敛与条件收敛, Riemann 重排定理]
      - name: 函数项级数与一致收敛
        concept_hints: [逐点收敛与一致收敛, Weierstrass $M$-判别法, 极限与微积分交换次序定理]
      - name: 幂级数、解析性与 Fourier 级数初步
        concept_hints: [收敛半径与 Abel 定理, Taylor 级数展开, 三角正交系, Fourier 级数收敛与 Parseval 等式]
  - id: c03
    name: 多元微积分与向量分析
    kind: core
    order: 3
    upstream: [c02, c04]
    upstream_notes: []
    history_sources:
      kline: 主要覆盖：Ch. 19, 23（偏导数与空间几何）、Ch. 24（拉格朗日乘子与变分）、Ch. 28（格林与位势）、Ch. 32（吉布斯-亥维赛向量分析 $\nabla$）
      supplement: 斯托克斯公式与外微分历史补充：Victor J. Katz (1979), *"The History of Stokes' Theorem"*, *Mathematics Magazine*, 
        52(3), 146–156 (<https://doi.org/10.1080/0025570X.1979.11976770>)
    topics:
      - name: $\mathbb{R}^n$ 的欧氏结构、内积与外积
        concept_hints: [范数与 Cauchy–Schwarz 不等式, '$\mathbb{R}^3$ 叉积与混合积', 柱坐标与球坐标]
      - name: 空间曲线与参数化运动
        concept_hints: [弧长参数化, 切向量, 曲率, 速度与加速度分解]
      - name: 多元函数的极限与连续性
        concept_hints: ['$\mathbb{R}^n$ 中的开集与闭集', 重极限与累次极限, 多元连续函数性质]
      - name: 偏导数、全微分与梯度
        concept_hints: [可微性的线性逼近定义, 偏导数与可微的关系, 方向导数与梯度 $\nabla f$]
      - name: 复合映射链式法则与 Jacobi 矩阵
        concept_hints: [向量值映射的微分, Jacobi 行列式, 多元 Taylor 公式]
      - name: 多元极值、Hessian 矩阵与 Lagrange 乘子法
        concept_hints: [无约束极值的二阶充分条件, 等式约束极值与 Lagrange 乘子几何意义]
      - name: 隐函数定理与逆映射定理
        concept_hints: [局部可逆性判据, 隐函数存在性与求导, 流形局部坐标化的基础]
      - name: 重积分与变量替换公式
        concept_hints: [有界域上的二重/三重积分, Fubini 累次积分, Jacobi 行列式变量替换]
      - name: 曲线积分与保守向量场
        concept_hints: [第一型与第二型曲线积分, 梯度场, 路径无关性与势函数重构]
      - name: 曲面积分与散度、旋度算子
        concept_hints: [参数曲面面积元, 第一型与第二型曲面积分, 通量, '散度 $\nabla\cdot\mathbf{F}$ 与旋度 $\nabla\times\mathbf{F}$']
      - name: Green 公式、Stokes 公式与 Gauss 散度定理
        concept_hints: [三大积分公式的物理与几何含义, 外微分形式 $d\omega$ 统一视角]
  - id: c04
    name: 线性代数 I：矩阵、方程组与几何直观
    kind: core
    order: 4
    upstream: [c01]
    upstream_notes: []
    history_sources:
      kline: 覆盖矩阵与行列式，缺 SVD：Ch. 15（解析几何）、Ch. 32（向量）、Ch. 33（克莱姆、柯西行列式、凯莱矩阵代数、实对称矩阵二次型主轴化）
      supplement: SVD 历史补充：G. W. Stewart (1993), *"On the Early History of the Singular Value Decomposition"*, *SIAM 
        Review*, 35(4), 551–566 (<https://doi.org/10.1137/1035134>)
    topics:
      - name: 线性方程组与 Gauss 消元法
        concept_hints: [行阶梯形, 主元, 初等矩阵, 矩阵乘法与分块矩阵, $PA=LU$ 分解]
      - name: 向量空间、子空间与四个基本子空间
        concept_hints: [列空间 $C(A)$, 零空间 $N(A)$, 行空间, 左零空间]
      - name: 线性无关、基与维数
        concept_hints: [生成集, Steinitz 替换定理, 矩阵的秩, '秩-零化度定理 $\dim V = \operatorname{rank}(A) + \dim N(A)$']
      - name: 线性变换及其矩阵表示
        concept_hints: [旋转/反射/投影的几何作用, 基变换公式, '相似矩阵 $B=P^{-1}AP$']
      - name: 行列式及其几何与代数性质
        concept_hints: [多重线性反对称性, 有向体积缩放因子, Laplace 展开, Cramer 法则]
      - name: 内积、正交性与正交投影
        concept_hints: [正交补子空间, '正交投影矩阵 $P=A(A^TA)^{-1}A^T$', 最小二乘法的几何解释]
      - name: Gram–Schmidt 正交化与 QR 分解
        concept_hints: [标准正交基构造, 正交矩阵 $Q^TQ=I$, $A=QR$ 分解]
      - name: 特征值、特征向量与矩阵对角化
        concept_hints: [特征多项式, 迹与行列式, 几何重数与代数重数, 可对角化判据, 矩阵幂]
      - name: 实对称矩阵、Hermite 矩阵与正定二次型
        concept_hints: [实对称矩阵正交对角化, 主轴定理, 正定矩阵等价判据, Sylvester 惯性定理]
      - name: 奇异值分解（SVD）与伪逆初步
        concept_hints: [$A=U\Sigma V^T$ 的几何意义, 四个基本子空间的标准正交基, Moore–Penrose 伪逆]
  - id: c05
    name: 线性代数 II：抽象空间、算子与标准形
    kind: core
    order: 5
    upstream: [c04, c01]
    upstream_notes: []
    history_sources:
      kline: 完整覆盖：Ch. 32（格拉斯曼《线性扩张论》高维线性空间）、Ch. 33（魏尔斯特拉斯初等因子与若尔当标准形）、Ch. 45, 46（内积空间与谱分解）
      supplement: —
    topics:
      - name: 一般域上的向量空间与商空间
        concept_hints: ['任意域 $\mathbb{F}$ 上的向量空间', 子空间直和分解 $V=U\oplus W$, 商空间 $V/U$ 与同构定理]
      - name: 对偶空间与对偶映射
        concept_hints: [线性泛函, 对偶基 $V^*$, 零化子 $U^0$, '有限维自反性 $V\cong V^{**}$', 转置映射 $T^*$]
      - name: 多项式环与算子极小多项式
        concept_hints: [多项式带余除法与唯一分解, Cayley–Hamilton 定理, 极小多项式与不变子空间]
      - name: 广义特征子空间与主分解定理
        concept_hints: [零化多项式互素分解, 可对角化充要条件, 可交换算子组同时对角化, 幂零算子]
      - name: Jordan 标准形与有理标准形
        concept_hints: [Jordan 块, 循环子空间分解, 相似不变量与 $\lambda$-矩阵 Smith 标准形]
      - name: 双线性型与二次型的一般理论
        concept_hints: [对称与交错双线性型, 合同变换, 正交几何与辛几何初步]
      - name: 有限维内积空间上的伴随算子与正规算子
        concept_hints: [Riesz 表示定理有限维版, 伴随算子 $T^*$, 正规算子 $TT^*=T^*T$, 酉算子与正交算子]
      - name: 有限维谱定理与算子极分解
        concept_hints: [复正规算子与实对称算子的谱分解定理, 正算子平方根, 极分解 $T=UP$]
  - id: c06
    name: 常微分方程与动力系统初步
    kind: core
    order: 6
    upstream: [c02, c04]
    upstream_notes: []
    history_sources:
      kline: 完整覆盖：Ch. 21（18世纪初等积分法、振动与悬链线）、Ch. 29（柯西-利普希茨存在唯一性、Sturm–Liouville 本征值、庞加莱天体力学定性理论与极限环）
      supplement: —
    topics:
      - name: 一阶常微分方程与方向场
        concept_hints: [分离变量法, 一阶线性方程与积分因子, 恰当方程, 方向场与积分曲线]
      - name: 初值问题的存在唯一性定理
        concept_hints: [Picard 逐次逼近法, Lipschitz 条件, 局部存在唯一性, 解对初值的连续依赖性与最大存在区间]
      - name: 二阶与高阶常系数线性微分方程
        concept_hints: [线性微分算子, Wronski 行列式与解空间维数, 特征方程, 复指数解]
      - name: 非齐次线性方程解法与振动模型
        concept_hints: [待定系数法, 常数变易法, 阻尼谐振子, 受迫振动与共振现象]
      - name: 幂级数解法与正则奇点
        concept_hints: [常点幂级数展开, Frobenius 方法, Legendre 方程与 Bessel 方程初步]
      - name: Laplace 变换与脉冲响应
        concept_hints: [Laplace 变换性质, 阶跃函数与 Dirac $\delta$ 函数, 传递函数, 卷积定理与 Green 函数]
      - name: 一阶线性微分方程组与矩阵指数
        concept_hints: [高阶方程化一阶系统, 特征值法求解, 矩阵指数 $\exp(At)$ 与基解矩阵]
      - name: 平面自治系统与相平面分析
        concept_hints: [平衡点分类：结点/鞍点/焦点/中心, 局部线性化 Hartman–Grobman 直观, 相图绘制]
      - name: Lyapunov 稳定性与极限环初步
        concept_hints: [Lyapunov 函数直接法, 守恒系统, Poincaré–Bendixson 定理与 Lotka–Volterra 模型]
  - id: c07
    name: 抽象代数 I：群论、环与域初步
    kind: core
    order: 7
    upstream: [c01, c05]
    upstream_notes: []
    history_sources:
      kline: 完整覆盖：Ch. 31（置换群、正规子群与伽罗瓦）、Ch. 34（高斯整数、库默尔理想数、戴德金理想）、Ch. 49（群、环、理想、域的公理化）
      supplement: 结构主义深化参考：Leo Corry (2004), *Modern Algebra and the Rise of Mathematical Structures* (2nd ed.), 
        Birkhäuser
    topics:
      - name: 群的公理、子群与循环群
        concept_hints: [群的定义, 子群判据, 元素阶, 循环群结构与生成元]
      - name: 置换群与对称性
        concept_hints: [对称群 $S_n$, 轮换分解, 奇偶置换与交错群 $A_n$, 正多面体对称群]
      - name: 陪集、Lagrange 定理与正规子群
        concept_hints: [左右陪集分解, '指数 $[G:H]$', Lagrange 定理, 正规子群 $N\triangleleft G$]
      - name: 商群、群同态与同构基本定理
        concept_hints: [商群 $G/N$, 核与像, 群的第一/第二/第三同构定理]
      - name: 群作用、轨道-稳定子定理与计数应用
        concept_hints: [群作用, 轨道与稳定化子, 共轭作用与类方程, Burnside 计数引理]
      - name: 有限群结构：有限生成交换群与 Sylow 定理
        concept_hints: [$p$-群性质, Sylow 三大定理, 小阶群同构分类, 单群概念与 $A_5$ 的单性]
      - name: 环、整环与除环
        concept_hints: [环的定义, 零因子与可逆元, 特征, 'Gauss 整数环 $\mathbb{Z}[i]$ 与多项式环']
      - name: 理想、商环与环同态基本定理
        concept_hints: [理想, 主理想, 商环 $R/I$, 环同态定理, 整环的分式域构造]
      - name: 素理想与极大理想
        concept_hints: [$R/P$ 为整环 $\iff P$ 为素理想，$R/M$ 为域 $\iff M$ 为极大理想，Krull/Zorn 极大理想存在性]
      - name: 整环中的因子分解：ED、PID 与 UFD
        concept_hints: [Euclid 整环 $\subset$ 主理想整环 $\subset$ 唯一分解整环, 'Gauss 引理与 $R[x]$ 唯一分解性', Eisenstein 不可约判别法]
  - id: c08
    name: 抽象代数 II：模论、Galois 理论与表示论初步
    kind: core
    order: 8
    upstream: [c07, c05]
    upstream_notes: []
    history_sources:
      kline: 覆盖 Galois 与环理想，缺群表示论与张量积：Ch. 31（伽罗瓦理论、尺规作图）、Ch. 49（施泰尼茨域论、诺特环）
      supplement: '群表示论历史补充：Thomas Hawkins (2000), *Emergence of the Theory of Lie Groups: An Essay in the History of Mathematics
        1869–1926* (含 Frobenius, Schur, Weyl 表示论起源), Springer'
    topics:
      - name: 环上的模、子模与自由模
        concept_hints: [模与模同态, 商模, 自由模与秩, Noether 环与 Hilbert 基定理]
      - name: 主理想整环（PID）上的有限生成模结构定理
        concept_hints: [不变因子与初等因子分解, 统一导出有限生成交换群结构与矩阵 Jordan 标准形]
      - name: 张量积与外代数
        concept_hints: [模与向量空间的张量积 $M\otimes_R N$, 泛性质, 对称代数与外代数 $\Lambda^k V$]
      - name: 域扩张、代数元与分裂域
        concept_hints: ['扩域次数与塔律 $[L:K]=[L:F][F:K]$', 代数元极小多项式, 尺规作图不可能性证明, 分裂域存在唯一性]
      - name: 可分扩张、正规扩张与有限域
        concept_hints: [重根与形式导数, 可分性与正规性, '有限域 $\mathbb{F}_{p^n}$ 的结构与 Frobenius 自同构']
      - name: Galois 群与 Galois 基本定理
        concept_hints: ['域自同构群 $\operatorname{Aut}(L/K)$', Galois 扩张, 中间域与 Galois 群子群的反演一一对应]
      - name: 可解群与高次方程根式可解性（Abel–Ruffini 定理）
        concept_hints: [分圆扩张, 循环扩张, 可解群, 五次及以上一般方程无根式解]
      - name: 有限群的线性表示与 Maschke 定理
        concept_hints: ['群表示与 $\mathbb{C}[G]$-模', 不变子空间与不可约表示, Maschke 完全可约定理, Schur 引理]
      - name: 特征标理论与正交关系
        concept_hints: [特征标表, 第一与第二正交关系, 正则表示分解 $\sum d_i^2 = |G|$, Fourier 分析在有限群上的体现]
  - id: c09
    name: 度量空间与点集拓扑（含基本群初步）
