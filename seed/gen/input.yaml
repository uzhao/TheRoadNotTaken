    upstream: []
    upstream_notes: []
    history_sources:
      kline: 完整覆盖：Ch. 3, 4（公理化与欧几里得算法）、Ch. 6, 13, 34（丢番图、费马、高斯同余与二次互反律）、Ch. 41, 51（集合论、可数性与公理化逻辑）
      supplement: RSA 与现代密码学数论动机补充：Whitfield Diffie (1988), *"The First Ten Years of Public-Key Cryptography"*, *Proc. 
